name: forward-logger
on:
  schedule:
    - cron: "30 0 * * *" # 07:30 WIB (GitHub schedules only in UTC)
  workflow_dispatch:
    inputs:
      dry:
        description: "true = fetch and compute but write no ledger rows and commit nothing; false = a real run"
        required: true
        default: "true"
permissions:
  contents: write
  issues: write
concurrency:
  group: forward-logger
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Offline tests (must pass before any run)
        run: node forward/test.mjs
      - name: Daily run
        id: run
        run: node forward/runner.mjs
        env:
          DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry == 'true' && '1' || '0' }}
      - name: Commit the day's files
        if: ${{ github.event_name == 'schedule' || inputs.dry != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forward
          git commit -m "Forward logger: data day ${{ steps.run.outputs.t }} (run ${{ steps.run.outputs.run_date }})" || echo "nothing to commit"
          git pull --rebase origin main
          git push origin main
      - name: Post the day's digest on tracking issue 2
        if: ${{ github.event_name == 'schedule' || inputs.dry != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment 2 --body "Forward logger run ${{ steps.run.outputs.run_date }} (data day ${{ steps.run.outputs.t }}). Digest: ${{ steps.run.outputs.digest }}. Commit: $(git rev-parse HEAD)"
